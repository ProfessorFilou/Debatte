<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debatten-Duell</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-app: #f4f7fa;
            --bg-surface: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --brand: #4f46e5;
            --brand-light: #eeebff;
            --emerald: #10b981;
            --emerald-bg: #ecfdf5;
            --rose: #f43f5e;
            --rose-bg: #fff1f2;
            --amber: #f59e0b;
            --amber-bg: #fffbeb;
            --border: #e6ebf1;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.02);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-pill: 99px;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .app-header {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .logo-dot { width: 10px; height: 10px; background: var(--brand); border-radius: 50%; box-shadow: 0 0 0 4px var(--brand-light); }

        .session-badge {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            background: #f1f5f9;
            padding: 8px 18px;
            border-radius: var(--radius-pill);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .main-wrapper {
            max-width: 1140px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .two-blocks-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            align-items: stretch;
        }

        @media (max-width: 850px) {
            .two-blocks-grid { grid-template-columns: 1fr; }
        }

        .glass-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 36px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hidden { display: none !important; }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .icon-box {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: var(--brand-light);
            color: var(--brand);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        h2 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.3px; }
        .desc { color: var(--text-sub); font-size: 14px; margin-bottom: 28px; line-height: 1.5; }

        label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 15px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 14px;
            color: var(--text-main);
            background: #fdfefe;
            margin-bottom: 18px;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 4px var(--brand-light);
            outline: none;
        }

        .btn {
            padding: 14px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-pill);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn svg, label svg, .session-badge svg, .market-status-bar svg {
            width: 16px;
            height: 16px;
            stroke-width: 2.2;
        }

        .btn-primary { background: var(--brand); color: white; width: 100%; }
        .btn-primary:hover { background: #4338ca; transform: translateY(-1px); }
        .btn-secondary { background: transparent; border-color: var(--border); color: var(--text-main); }
        .btn-secondary:hover { background: #f8fafc; border-color: var(--text-sub); }
        .btn-warning { background: var(--amber-bg); color: var(--amber); border-color: #fef3c7; }
        .btn-warning:hover { background: var(--amber); color: white; }
        .btn-danger { background: var(--rose-bg); color: var(--rose); border-color: #ffe4e6; }
        .btn-danger:hover { background: var(--rose); color: white; }

        .preset-pills {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .preset-pill {
            font-size: 12px;
            padding: 7px 14px;
            background: #f8fafc;
            border-radius: var(--radius-pill);
            cursor: pointer;
            color: var(--text-sub);
            font-weight: 600;
            border: 1px solid var(--border);
            transition: all 0.15s ease;
        }
        .preset-pill:hover {
            border-color: var(--brand);
            color: var(--brand);
            background: var(--brand-light);
        }

        .sub-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .team-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 18px;
            margin-bottom: 16px;
        }

        .team-card input {
            background: #ffffff;
            margin-bottom: 10px;
        }
        .team-card input:last-child { margin-bottom: 0; }

        .market-status-bar {
            background: #eff6ff;
            color: var(--brand);
            padding: 14px 20px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 28px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            line-height: 1.45;
        }

        .huge-timer {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: -2px;
            margin: 8px 0 4px 0;
            font-variant-numeric: tabular-nums;
        }

        .timer-warning { color: var(--amber); }
        .timer-over { color: var(--rose); }

        .flow-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--emerald);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .phase-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
            background: #f1f5f9;
            color: var(--text-sub);
        }

        .phase-list {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: #fbfcfd;
            padding: 8px;
            max-height: 430px;
            overflow-y: auto;
        }

        .phase-row {
            padding: 13px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .phase-row:last-child { border-bottom: none; }
        .phase-row:hover { background: #f1f5f9; }

        .phase-row.active {
            background: var(--brand-light);
            color: var(--brand);
            font-weight: 700;
        }

        .phase-row.done {
            color: var(--text-sub);
            opacity: 0.65;
        }

        .phase-row-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls-row {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }
    </style>
</head>

### Teil 3: JavaScript-Logik & Abschluss
```html
    <script>
        let phases = [];
        let currentPhaseIndex = 0;
        let timeLeft = 0;
        let timerInterval = null;
        let isRunning = false;

        const icons = {
            play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
            pause: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`,
            check: `<svg style="width:15px;height:15px;color:var(--emerald);flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,
            mic: `<svg style="width:15px;height:15px;color:var(--brand);flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>`,
            circle: `<svg style="width:15px;height:15px;color:var(--text-sub);opacity:0.5;flex-shrink:0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>`,
            clock: `<svg style="width:15px;height:15px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
            alert: `<svg style="width:15px;height:15px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
        };

        function setTopic(text) {
            document.getElementById('debate-question').value = text;
        }

        function formatTime(seconds) {
            const isNegative = seconds < 0;
            const absSec = Math.abs(seconds);
            const mins = Math.floor(absSec / 60);
            const secs = absSec % 60;
            const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            return isNegative ? `-${formatted}` : formatted;
        }

        function startDebate() {
            const questionInput = document.getElementById('debate-question').value.trim();
            const question = questionInput || "Soll ein verpflichtendes soziales Jahr eingeführt werden?";
            
            const openingSec = parseInt(document.getElementById('time-opening').value) || 120;
            const freeSec = (parseInt(document.getElementById('time-free').value) || 12) * 60;
            const closingSec = parseInt(document.getElementById('time-closing').value) || 60;

            const pro1 = document.getElementById('name-pro1').value.trim() || "Pro 1";
            const pro2 = document.getElementById('name-pro2').value.trim() || "Pro 2";
            const contra1 = document.getElementById('name-contra1').value.trim() || "Contra 1";
            const contra2 = document.getElementById('name-contra2').value.trim() || "Contra 2";

            phases = [
                { round: "1. Eröffnungsrunde", title: `Eröffnungsrede: ${pro1}`, duration: openingSec, hint: "Begriffe klären, Position beziehen und erstes Pro-Argument darlegen." },
                { round: "1. Eröffnungsrunde", title: `Eröffnungsrede: ${contra1}`, duration: openingSec, hint: "Auf Pro 1 eingehen, Gegenposition beziehen und erstes Contra-Argument nennen." },
                { round: "1. Eröffnungsrunde", title: `Eröffnungsrede: ${pro2}`, duration: openingSec, hint: "Pro-Position stützen und ein zweites, eigenständiges Argument einbringen." },
                { round: "1. Eröffnungsrunde", title: `Eröffnungsrede: ${contra2}`, duration: openingSec, hint: "Contra-Position stützen und ein zweites, eigenständiges Gegenargument einbringen." },
                { round: "2. Freie Aussprache", title: "Freie Aussprache (Alle)", duration: freeSec, hint: "Offener Schlagabtausch: Argumente prüfen, nachfragen, abwägen und entkräften." },
                { round: "3. Schlussrunde", title: `Schlussrede: ${contra1}`, duration: closingSec, hint: "Keine neuen Argumente! Debatte aus Contra-Sicht bilanzieren und Frage beantworten." },
                { round: "3. Schlussrunde", title: `Schlussrede: ${pro1}`, duration: closingSec, hint: "Keine neuen Argumente! Debatte aus Pro-Sicht bilanzieren und Frage beantworten." },
                { round: "3. Schlussrunde", title: `Schlussrede: ${contra2}`, duration: closingSec, hint: "Abschließendes Fazit der Contra-Seite." },
                { round: "3. Schlussrunde", title: `Schlussrede: ${pro2}`, duration: closingSec, hint: "Abschließendes Fazit der Pro-Seite." }
            ];

            document.getElementById('display-question').textContent = question;
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('debate-screen').classList.remove('hidden');
            document.getElementById('header-status').innerHTML = `${icons.mic} Debatte läuft`;

            loadPhase(0);
        }

        function backToSettings() {
            stopTimer();
            document.getElementById('debate-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('header-status').innerHTML = `${icons.clock} Vorbereitung`;
        }

        function loadPhase(index) {
            stopTimer();
            currentPhaseIndex = index;
            const phase = phases[currentPhaseIndex];
            timeLeft = phase.duration;

            document.getElementById('current-round-badge').textContent = phase.round;
            document.getElementById('phase-counter').textContent = `Schritt ${currentPhaseIndex + 1} / ${phases.length}`;
            document.getElementById('current-speaker-title').textContent = phase.title;
            document.getElementById('current-phase-hint').textContent = phase.hint;

            updateTimerDisplay();
            renderPhaseList();
        }

        function updateTimerDisplay() {
            const display = document.getElementById('timer-display');
            const statusText = document.getElementById('timer-status-text');
            display.textContent = formatTime(timeLeft);

            display.classList.remove('timer-warning', 'timer-over');

            if (timeLeft <= 0) {
                display.classList.add('timer-over');
                statusText.innerHTML = `${icons.alert} <span>Zeit abgelaufen! Bitte zum Ende kommen.</span>`;
                statusText.style.color = "var(--rose)";
            } else if (timeLeft <= 15) {
                display.classList.add('timer-warning');
                statusText.innerHTML = `${icons.alert} <span>Letzte 15 Sekunden!</span>`;
                statusText.style.color = "var(--amber)";
            } else {
                statusText.innerHTML = `${icons.clock} <span>${isRunning ? "Redezeit läuft..." : "Pausiert / Bereit"}</span>`;
                statusText.style.color = "var(--emerald)";
            }
        }

        function toggleTimer() {
            if (isRunning) {
                stopTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('btn-toggle-timer').innerHTML = `${icons.pause} Pause`;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            document.getElementById('btn-toggle-timer').innerHTML = `${icons.play} Start`;
            updateTimerDisplay();
        }

        function resetCurrentTimer() {
            stopTimer();
            timeLeft = phases[currentPhaseIndex].duration;
            updateTimerDisplay();
        }

        function nextPhase() {
            if (currentPhaseIndex < phases.length - 1) {
                loadPhase(currentPhaseIndex + 1);
            } else {
                stopTimer();
                alert("Die Debatte ist beendet! Zeit für das Feedback.");
            }
        }

        function renderPhaseList() {
            const container = document.getElementById('phase-list-container');
            container.innerHTML = "";

            phases.forEach((p, idx) => {
                const row = document.createElement('div');
                row.className = 'phase-row';
                
                let statusIcon = icons.circle;
                if (idx === currentPhaseIndex) {
                    row.classList.add('active');
                    statusIcon = icons.mic;
                } else if (idx < currentPhaseIndex) {
                    row.classList.add('done');
                    statusIcon = icons.check;
                }

                row.onclick = () => loadPhase(idx);

                row.innerHTML = `
                    <div class="phase-row-left">
                        ${statusIcon}
                        <span>${idx + 1}. ${p.title}</span>
                    </div>
                    <span style="font-variant-numeric: tabular-nums; font-weight: 600;">${formatTime(p.duration)}</span>
                `;
                container.appendChild(row);
            });
        }
    </script>
</body>
